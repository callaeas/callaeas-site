<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Callaeas | Product &amp; technology consultancy</title>
<meta name="description" content="Callaeas is a product and technology consultancy. Digital spaghetti, untangled.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Recursive:slnt,wght,CASL,CRSV,MONO@-15..0,300..1000,0..1,0..1,0..1&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1d2530;
    --ink-soft: #4d5a6b;
    --paper: #f6f5f1;
    --line: #dcdad2;
    --accent: #2547d0;
    /* tagline colour arc: chaos (warm amber) cooling into the house indigo (calm) */
    --warm: #b5670c;      /* deep amber — legible on the light paper ground */
    --warm-mid: #9a4a5f;  /* warm rose bridge amber -> indigo */
    --cool: #2547d0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    /* whole page on one type system: Recursive. Prose reads in a lightly Casual Linear;
       the Mono "chrome" rules below reset CASL to 0 to stay crisp. */
    font-family: 'Recursive', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-variation-settings: 'MONO' 0, 'CASL' 0.32, 'wght' 400, 'slnt' 0, 'CRSV' 0;
    background: var(--paper);
    color: var(--ink);
    line-height: 1.62;
    -webkit-font-smoothing: antialiased;
    /* the page is one sheet: body is a flex column so the card can centre
       and the colophon footer sinks to the base. vh line first = old-Safari fallback. */
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
  }
  main { display: flex; flex-direction: column; flex: 1 0 auto; }
  /* .wrap controls horizontal gutter only (longhands) so it never clobbers the
     vertical padding set on .hero / section / footer via the cascade. */
  /* width:100% matters: .wrap children are flex items now, and their auto side
     margins would otherwise shrink them to fit-content and break the shared left axis */
  .wrap { width: 100%; max-width: 700px; margin: 0 auto; padding-left: 24px; padding-right: 24px; }
  @media (max-width: 400px) { .wrap { padding-left: 20px; padding-right: 20px; } }

  /* ---- The card: one variable font (Recursive) does everything ---- */
  /* auto margins centre the card when there's room and collapse to 0 when there
     isn't, so short/landscape viewports scroll instead of clipping.
     vertical padding longhands only — .wrap owns the horizontal gutter. */
  .card {
    margin-top: auto; margin-bottom: auto;
    padding-top: 64px; padding-bottom: 56px;
  }

  /* Brand = Recursive at its fully-resolved coordinate: linear, upright, heavy */
  .brand {
    font-family: 'Recursive', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-variation-settings: 'MONO' 0, 'CASL' 0, 'wght' 860, 'slnt' 0, 'CRSV' 0;
    font-size: clamp(3.2rem, 11vw, 6.6rem);
    line-height: 0.98;
    letter-spacing: -0.02em;
    color: var(--ink);
  }

  /* Tagline = the same font travelling toward that coordinate, one line, morphing per letter */
  .tagline {
    margin-top: 0.16em;
    font-family: 'Recursive', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    white-space: nowrap;
    font-size: clamp(1.2rem, 6vw, 2.65rem);
    line-height: 1.1;
    letter-spacing: -0.005em;
    color: var(--cool); /* solid-indigo fallback where background-clip:text is unsupported */
  }
  @supports ((-webkit-background-clip: text) or (background-clip: text)) {
    .tagline {
      background: linear-gradient(90deg, var(--warm) 0%, var(--warm) 40%, var(--warm-mid) 66%, var(--cool) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }
  }
  /* the 'untangled' letters ramp onto the mono grid; pull tracking to absorb the widening */
  .tagline .m { letter-spacing: -0.012em; }

  /* on-load: the tagline settles into place as one unit (motion-gated).
     NB: animate the whole line, not per-letter — per-child opacity breaks the
     parent's background-clip:text gradient and renders the glyphs invisible. */
  @media (prefers-reduced-motion: no-preference) {
    .tagline { animation: settle 0.7s cubic-bezier(0.22, 0.61, 0.36, 1) both; }
  }
  @keyframes settle {
    from { opacity: 0; transform: translateY(0.16em); }
    to   { opacity: 1; transform: none; }
  }

  /* the one piece of prose on the page — standfirst size, plain-px fallback first */
  .pitch {
    margin-top: 36px;
    margin-top: clamp(28px, 5svh, 44px);
    font-size: 1.125rem;
    color: var(--ink-soft);
    max-width: 46ch;
  }

  /* the turn to the second strophe: the page's one big gap, then the contact
     pair binds tight beneath it. no label — the Casual→Mono voice change does it. */
  .hello {
    margin-top: 48px;
    margin-top: clamp(36px, 7svh, 64px);
    font-size: 1.05rem;
    color: var(--ink-soft);
  }

  .rule { border: 0; border-top: 1px solid var(--line); margin-bottom: 18px; }

  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 3px; }

  .contact-line {
    /* the address as a code-like Mono line */
    margin-top: 8px;
    font-variation-settings: 'MONO' 1, 'CASL' 0, 'wght' 480, 'slnt' 0, 'CRSV' 0;
    font-size: 1.1rem;
    letter-spacing: -0.01em;
  }

  footer {
    padding-top: 0;
    padding-bottom: 32px;
    padding-bottom: clamp(28px, 5svh, 44px);
    font-variation-settings: 'MONO' 1, 'CASL' 0, 'wght' 420, 'slnt' 0, 'CRSV' 0;
    font-size: 0.8rem;
    letter-spacing: 0.01em;
    color: var(--ink-soft);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #e8e6df;
      --ink-soft: #a3aab6;
      --paper: #171c24;
      --line: #2c3440;
      --accent: #7d95f5;
      --warm: #f6a63c;      /* brighter amber reads well on the dark ground */
      --warm-mid: #cf7a9e;
      --cool: #7d95f5;
    }
  }
</style>
</head>

    <p class="pitch">Digital businesses get messy — the product, the tech, and the commercial knots in between that nobody quite owns. We come in, make sense of it, and get things launched.</p>
